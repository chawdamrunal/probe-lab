version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
      time: "23:30"
      timezone: "UTC"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "23:35"
      timezone: "UTC"
  - package-ecosystem: "bundler"
    directory: "/actor-a"
    schedule:
      interval: "cron"
      cronjob: "40 16 * * *"
      timezone: "UTC"
    open-pull-requests-limit: 1
  - package-ecosystem: "bundler"
    directory: "/actor-b"
    schedule:
      interval: "cron"
      cronjob: "40 16 * * *"
      timezone: "UTC"
    open-pull-requests-limit: 1
